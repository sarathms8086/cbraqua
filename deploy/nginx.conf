server {
    listen 80;
    server_name danywens.com www.danywens.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name danywens.com www.danywens.com;

    ssl_certificate /etc/letsencrypt/live/danywens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danywens.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # Frontend
    location / {
        root /var/www/danywens/dist;
        try_files $uri $uri/ /index.html;

        # Never cache the SPA shell (index.html) so deploys take effect immediately
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        # Cache hashed static assets aggressively
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|mp4)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
        }
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads
    location /uploads {
        alias /var/www/danywens/server/uploads;
    }
}
